# TEMPORARY for issue #130: boots aibox's VM on the runner, whose Linux has
# no vsock namespaces, so the VM reaches aibox over the virtio serial port.
# It checks that the port works and measures what it costs. Remove it before
# the pull request merges.
name: serial port

on:
  push:
    branches: [feat/serial-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: open KVM to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Ubuntu keeps unprivileged user namespaces from programs without an
      # AppArmor profile of their own, and bubblewrap needs them
      - name: install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # the virtiofsd of Ubuntu 24.04 has no --translate-uid and its QEMU no
      # -accel kvm,device=, which aibox both needs, so they come from Nix
      - uses: cachix/install-nix-action@v31
      - name: install QEMU and virtiofsd
        run: |
          nix profile install nixpkgs#virtiofsd nixpkgs#qemu_kvm
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          "$HOME/.nix-profile/bin/virtiofsd" --version
          "$HOME/.nix-profile/bin/qemu-system-x86_64" --version
      - name: show the kernel
        run: |
          uname -r
          ls /proc/sys/net/vsock/ 2>&1 || true
      - name: build aibox
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aibox" ./cmd/aibox
      - name: download the VM image of the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          gh release download --repo The127/aibox --pattern aibox-image_amd64.tar.gz --output - | tar -xz -C "$RUNNER_TEMP/image"
          ls -l "$RUNNER_TEMP/image"
      # the init of the release knows no port yet, so the image gets the
      # init of this branch
      - name: put the init of this branch into the image
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/aibox-init" ./cmd/aibox-init
          debugfs -w -R "rm /sbin/init" "$RUNNER_TEMP/image/os.ext4"
          debugfs -w -R "write $RUNNER_TEMP/aibox-init /sbin/init" "$RUNNER_TEMP/image/os.ext4"
          debugfs -w -R "sif /sbin/init mode 0100755" "$RUNNER_TEMP/image/os.ext4"
          debugfs -R "stat /sbin/init" "$RUNNER_TEMP/image/os.ext4" | head -3
      - name: write the config new projects start from
        run: |
          mkdir -p ~/.aibox
          printf 'allow:\n  - preset:github\n' > ~/.aibox/config.yaml
      - name: time the download on the runner itself
        run: time git clone --bare --depth 1 https://github.com/torvalds/linux "$RUNNER_TEMP/linux-host.git"
      # QEMU from Nix exits at once in the sandbox, with nothing on its
      # output. This only looks for why, the checks run without the sandbox
      - name: try the sandbox and trace why QEMU exits
        continue-on-error: true
        run: |
          mkdir -p ~/sandboxed
          cd ~/sandboxed
          (echo exit; sleep 10; while pgrep -x aibox > /dev/null; do sleep 2; done) |
            script -q -e -c "strace -f -o $RUNNER_TEMP/strace.log $RUNNER_TEMP/aibox run --shell --image $RUNNER_TEMP/image" /dev/null || true
          grep -E 'execve\(|exit_group|EACCES|EPERM|ENOENT.*(lib|nix)|killed|SIGSYS' "$RUNNER_TEMP/strace.log" | grep -v 'resumed>' | tail -60
      - name: boot the VM and run the checks in its shell
        run: |
          mkdir -p ~/project
          cd ~/project
          cat > "$RUNNER_TEMP/commands" <<'EOF'
          echo MARK-start
          time git clone --bare --depth 1 https://github.com/torvalds/linux ~/.cache/linux.git && echo MARK-clone-$((1+1))
          time (head -c 10000000 /dev/urandom | base64)
          echo MARK-terminal-$((1+1))
          exit
          EOF
          # the shell needs a terminal, which script gives it. script ends
          # only when its input does, so the input stays open until aibox
          # is gone
          (cat "$RUNNER_TEMP/commands"; sleep 10; while pgrep -x aibox > /dev/null; do sleep 2; done) |
            script -q -e -c "$RUNNER_TEMP/aibox run --shell --no-sandbox --image $RUNNER_TEMP/image" "$RUNNER_TEMP/session.log" > /dev/null
      - name: show the results
        if: always()
        run: |
          echo '--- console.log'
          head -5 ~/.aibox/projects/-home-runner-project/console.log || true
          echo '--- the session, without the terminal test output'
          grep -a -v -E '^[A-Za-z0-9+/=]{60,}' "$RUNNER_TEMP/session.log" | tail -60 || true
          grep -a -q MARK-clone-2 "$RUNNER_TEMP/session.log"
          grep -a -q MARK-terminal-2 "$RUNNER_TEMP/session.log"
