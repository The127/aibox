# The VM has no network devices, only loopback and the proxy on it, so a
# container shares the VM's network. There is no systemd for cgroups or
# the event log. Pulled layers are staged on the state disk rather than in
# /var/tmp, which is RAM.
[containers]
netns = "host"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
image_copy_tmp_dir = "/home/user/.local/share/containers"
