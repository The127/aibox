# Package dependency rules, checked by
# `go tool -modfile=hack/tools/go.mod arch-go`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the version reads what the Go toolchain wrote into the binary and
  # nothing else
  - package: '**.internal.version$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the vm only builds command lines. Starting the programs happens
  # elsewhere
  - package: '**.internal.vm$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the host serves the proxy and the terminal of a running VM, whichever
  # backend started it
  - package: '**.internal.host$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.backend$'
        - '**.internal.proxy$'
        - '**.internal.session$'
    shouldNotDependsOn:
      internal:
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the machine prepares what booting the kernel of aibox needs on the
  # host, whichever VMM boots it
  - package: '**.internal.machine$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.backend$'
        - '**.internal.vm$'
    shouldNotDependsOn:
      external:
        - 'github.com/urfave/cli/v3'
  # vzlaunch is the backend that runs a VM with Virtualization.framework
  # of macOS
  - package: '**.internal.vzlaunch$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.backend$'
        - '**.internal.host$'
        - '**.internal.machine$'
        - '**.internal.vm$'
        - '**.internal.seatbelt$'
    shouldNotDependsOn:
      external:
        - 'github.com/urfave/cli/v3'
  # seatbelt confines aibox on macOS with the sandbox of the system and
  # knows nothing of aibox
  - package: '**.internal.seatbelt$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the project only manages folders on the host
  - package: '**.internal.project$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
      standard:
        - os/exec
        - net
        - syscall
  # the backend says what a run needs and what runs it. It knows the proxy
  # options and nothing of how a VM is run
  - package: '**.internal.backend$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.proxy$'
    shouldNotDependsOn:
      internal:
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the launch is the backend that runs a VM on QEMU and virtiofsd
  - package: '**.internal.launch$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.backend$'
        - '**.internal.host$'
        - '**.internal.machine$'
        - '**.internal.vm$'
        - '**.internal.proxy$'
        - '**.internal.session$'
        - '**.internal.vsockns$'
        - '**.internal.sandbox$'
        - '**.internal.confine$'
    shouldNotDependsOn:
      external:
        - 'github.com/urfave/cli/v3'
  # the tunnel accepts and joins connections and knows nothing else
  - package: '**.internal.tunnel$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the proxy only knows net. Where its listener comes from is not its business
  - package: '**.internal.proxy$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.tunnel$'
    shouldNotDependsOn:
      internal:
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the session speaks SSH over a connection and knows nothing else
  - package: '**.internal.session$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the confinement knows the kernel and nothing of aibox
  - package: '**.internal.confine$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the sandbox only builds the bubblewrap command line
  - package: '**.internal.sandbox$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the vsock namespace helper knows the kernel and nothing of aibox
  - package: '**.internal.vsockns$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the gitconfig runs git on the host and knows nothing else
  - package: '**.internal.gitconfig$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the config reads the settings of a project and knows nothing else
  - package: '**.internal.config$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # the cli defines the commands and wires the other packages together.
  # It is the only package that knows urfave/cli
  - package: '**.internal.cli$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.version$'
        - '**.internal.project$'
        - '**.internal.backend$'
        - '**.internal.machine$'
        - '**.internal.launch$'
        - '**.internal.vzlaunch$'
        - '**.internal.config$'
        - '**.internal.proxy$'
        - '**.internal.gitconfig$'
        - '**.internal.vsockns$'
  # the guest is the init of the VM. It knows nothing of the host side
  - package: '**.internal.guest$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.tunnel$'
        - '**.internal.vm$'
        - '**.internal.session$'
    shouldNotDependsOn:
      internal:
        - '**.cmd.**'
      external:
        - 'github.com/urfave/cli/v3'
  # a command only runs the root command of the cli, the commands
  # themselves live in the cli
  - package: '**.cmd.aibox$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.cli$'
    shouldNotDependsOn:
      external:
        - 'github.com/urfave/cli/v3'
  # the init only runs the guest
  - package: '**.cmd.aibox-init$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.guest$'
