name: scorecard

on:
  push:
    branches: [main]
  # the Maintained check needs a run even in weeks without a push
  schedule:
    - cron: "15 14 * * 0"
  # the Branch-Protection check reads the rules of the default branch
  branch_protection_rule:

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

# the API at api.scorecard.dev refuses results of a workflow with write
# permissions or env outside the job, and of a job with steps other than
# the actions it approves
permissions: {}

# nothing here needs a cache, and none can be poisoned for the job then
cache-mode: none

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard only scores the default branch
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write
      # signs the results the action publishes for the badge
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: results.sarif
