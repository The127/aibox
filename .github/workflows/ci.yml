name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      # install only, `just lint` runs it so that ci and the hooks agree.
      # dependabot cannot see devenv.nix, so this version and the one below
      # follow the devenv by hand
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
      # `just reuse` runs reuse, which the devenv has locally
      - run: pipx install reuse==6.2.0
      # tests that need vsock namespaces, Landlock network rules or KVM skip
      # themselves where the runner lacks them
      - run: just ci
