name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v4
      # install only, `just lint` runs it so that ci and the hooks agree.
      # dependabot cannot see devenv.nix, so this version and the one below
      # follow the devenv by hand
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      # `just reuse` runs reuse, which the devenv has locally. It needs a
      # module to detect the encoding of files, which macOS lacks
      - run: pipx install "reuse[charset-normalizer]==6.2.0"
      # `just docs` builds the documentation site with mdbook, which the
      # devenv has locally
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      # tests that need vsock namespaces, Landlock network rules, KVM or the
      # entitlement of Virtualization.framework skip themselves where the
      # runner lacks them
      - run: just ci

  # builds and tests the host side on Windows. The recipes of the justfile
  # are for a Unix shell, and `just lint` covers Windows from Linux
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # the cli, config, gitconfig, image and project still take paths as
      # Unix paths, and their tests with them, until aibox runs a VM on
      # Windows
      - run: go test -race $(go list ./... | grep -v -e internal/cli -e internal/config -e internal/gitconfig -e internal/image -e internal/project)
        shell: bash

  # builds the Nix package of the release in nix/release.json, which checks
  # its hashes
  nix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#aibox
      - run: ./result/bin/aibox --version
      # Virtualization.framework runs aibox only while the signature of the
      # release, with its entitlement, still holds
      - if: runner.os == 'macOS'
        run: |
          codesign --verify --strict result/bin/aibox
          codesign --display --entitlements - result/bin/aibox | grep com.apple.security.virtualization

  # the ruleset of main requires a check named ci, which the jobs of the
  # matrix are not, so this one stands for all of them
  ci:
    needs: [check, windows, nix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
      - run: test "${{ needs.windows.result }}" = success
      - run: test "${{ needs.nix.result }}" = success
