name: release

on:
  push:
    branches: [main]

# the app token below does the writing, so that the release pull request
# runs ci and the tag can start other workflows
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/images.yml

  # on a Mac, since the macOS binary needs cgo and codesign
  goreleaser:
    needs: [release-please, images]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # writes the cask to the tap, which the token of the workflow cannot
      - uses: actions/create-github-app-token@v3
        id: tap-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # goreleaser attaches the images and lists them in checksums.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: aibox-image_*
          path: images
          merge-multiple: true

      # aibox downloads only the images whose SHA-256 it was built with, and
      # boots only the kernels whose SHA-256 it was built with. The step
      # fails if an image is missing.
      - name: take the digests of the images
        run: |
          set -o pipefail
          for arch in amd64 arm64; do
            archive=images/aibox-image_$arch.tar.gz
            images="$images,$arch:$(shasum -a 256 "$archive" | cut -d' ' -f1)"
            kernels="$kernels,$arch:$(tar -xzOf "$archive" vmlinuz | shasum -a 256 | cut -d' ' -f1)"
          done
          echo "AIBOX_IMAGE_DIGESTS=${images#,}" >> "$GITHUB_ENV"
          echo "AIBOX_KERNEL_DIGESTS=${kernels#,}" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}

  # points the Nix package at the release. The ruleset of main asks for the
  # ci check, so the change goes through a pull request, which ci builds and
  # which merges once it passes
  nix:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main

      - name: point nix/release.json at the release
        run: |
          gh release download "$TAG" --pattern checksums.txt --dir "$RUNNER_TEMP"
          hack/nix-release.sh "${TAG#v}" "$RUNNER_TEMP/checksums.txt"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix/release
          title: "chore: point the Nix package at ${{ needs.release-please.outputs.tag_name }}"
          commit-message: "chore: point the Nix package at ${{ needs.release-please.outputs.tag_name }}"
          signoff: true
          body: Updates `nix/release.json` to the Linux archive of the release.

      - name: merge once ci passes
        if: steps.pr.outputs.pull-request-url != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
